name: CI

on:
  push:
    branches:
      - main
      - staging
      - dev
  pull_request:
    branches:
      - main
      - staging
      - dev
  workflow_dispatch:

permissions:
  contents: read

# A PR shares one group, so a newer push cancels its older run. Every other run gets its own
# group, so a branch push is never cancelled or replaced while queued and every merge keeps a result.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

env:
  MAVEN_ARGS: --batch-mode --no-transfer-progress

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x ./mvnw

      # Enforcer rules, main and test compilation, and packaging, without running tests.
      - name: Compile and package
        run: ./mvnw verify -DskipTests

  unit-tests:
    name: Unit tests
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x ./mvnw

      - name: Run tests without PostgreSQL
        run: ./mvnw test -DexcludedGroups=postgres

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-reports
          path: '**/target/surefire-reports/**'
          if-no-files-found: ignore
          retention-days: 7

  postgres-tests:
    name: PostgreSQL integration tests
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x ./mvnw

      # Tests tagged "postgres" start PostgreSQL through Testcontainers on the runner's Docker.
      - name: Run PostgreSQL tests
        run: ./mvnw test -pl dedup4j-spring-boot-starter -am -Dgroups=postgres -Dsurefire.failIfNoSpecifiedTests=false

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: postgres-test-reports
          path: '**/target/surefire-reports/**'
          if-no-files-found: ignore
          retention-days: 7
