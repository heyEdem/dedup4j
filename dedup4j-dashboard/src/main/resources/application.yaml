server:
  address: 127.0.0.1
  port: 9090

dedup4j:
  dashboard:
    database-path: ./dedup4j-dashboard.sqlite
    polling-interval: 30s
    failure-retention: 7d

spring:
  datasource:
    url: jdbc:sqlite:${dedup4j.dashboard.database-path:./dedup4j-dashboard.sqlite}
    driver-class-name: org.sqlite.JDBC
