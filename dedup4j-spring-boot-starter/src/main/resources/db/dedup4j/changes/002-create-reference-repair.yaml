databaseChangeLog:
  - changeSet:
      id: 002-create-reference-repair
      author: dedup4j
      changes:
        - createTable:
            tableName: dedup4j_reference_repair
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: pk_dedup4j_reference_repair
              - column:
                  name: asset_content_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: previous_count
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: repaired_count
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: run_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: instance_id
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: repaired_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: compensates_repair_id
                  type: UUID
        - addForeignKeyConstraint:
            baseTableName: dedup4j_reference_repair
            baseColumnNames: asset_content_id
            referencedTableName: dedup4j_asset_content
            referencedColumnNames: id
            constraintName: fk_dedup4j_reference_repair_content
        # Also makes the table referenced, so H2 rejects TRUNCATE on it.
        - addForeignKeyConstraint:
            baseTableName: dedup4j_reference_repair
            baseColumnNames: compensates_repair_id
            referencedTableName: dedup4j_reference_repair
            referencedColumnNames: id
            constraintName: fk_dedup4j_reference_repair_compensates
        - createIndex:
            tableName: dedup4j_reference_repair
            indexName: idx_dedup4j_reference_repair_content
            columns:
              - column:
                  name: asset_content_id
        - createIndex:
            tableName: dedup4j_reference_repair
            indexName: idx_dedup4j_reference_repair_run
            columns:
              - column:
                  name: run_id
