databaseChangeLog:
  - changeSet:
      id: history-002-append-only-postgresql
      author: dedup4j
      dbms: postgresql
      changes:
        - createProcedure:
            procedureBody: |
              CREATE OR REPLACE FUNCTION dedup4j_reject_history_change() RETURNS trigger AS $$
              BEGIN
                RAISE EXCEPTION 'dedup4j history tables are append-only';
              END;
              $$ LANGUAGE plpgsql
        - sql:
            sql: CREATE TRIGGER dedup4j_history_dataset_no_row_change BEFORE UPDATE OR DELETE ON dedup4j_history_dataset FOR EACH ROW EXECUTE FUNCTION dedup4j_reject_history_change()
        - sql:
            sql: CREATE TRIGGER dedup4j_history_dataset_no_truncate BEFORE TRUNCATE ON dedup4j_history_dataset FOR EACH STATEMENT EXECUTE FUNCTION dedup4j_reject_history_change()
        - sql:
            sql: CREATE TRIGGER dedup4j_upload_event_no_row_change BEFORE UPDATE OR DELETE ON dedup4j_upload_event FOR EACH ROW EXECUTE FUNCTION dedup4j_reject_history_change()
        - sql:
            sql: CREATE TRIGGER dedup4j_upload_event_no_truncate BEFORE TRUNCATE ON dedup4j_upload_event FOR EACH STATEMENT EXECUTE FUNCTION dedup4j_reject_history_change()
        - sql:
            sql: CREATE TRIGGER dedup4j_failure_event_no_row_change BEFORE UPDATE OR DELETE ON dedup4j_failure_event FOR EACH ROW EXECUTE FUNCTION dedup4j_reject_history_change()
        - sql:
            sql: CREATE TRIGGER dedup4j_failure_event_no_truncate BEFORE TRUNCATE ON dedup4j_failure_event FOR EACH STATEMENT EXECUTE FUNCTION dedup4j_reject_history_change()
